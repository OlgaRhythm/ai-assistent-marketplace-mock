name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Verify Maven build
        id: maven
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build Docker image
        run: docker build --tag app:ci .
      - name: Smoke test SSO and order isolation
        shell: bash
        run: |
          container=$(docker run --detach --publish 127.0.0.1::8081 \
            --env "SSO_SHARED_SECRET=$(openssl rand -hex 32)" app:ci)
          cleanup() {
            if [ "$1" -ne 0 ]; then
              docker logs "$container"
            fi
            docker rm --force "$container" >/dev/null
          }
          trap 'cleanup $?' EXIT

          base_url="http://$(docker port "$container" 8081/tcp)"
          curl --fail --silent --show-error --max-time 5 --retry 20 \
            --retry-all-errors --retry-delay 2 --output /dev/null "$base_url/actuator/health"

          login='{"username":"alice","password":"alice123"}'
          token=$(curl --fail --silent --show-error --max-time 10 \
            --header 'Content-Type: application/json' --data "$login" \
            "$base_url/api/auth/login" | jq --exit-status --raw-output '.token | select(length > 0)')
          auth="Authorization: Bearer $token"

          own_id=$(curl --fail --silent --show-error --max-time 10 \
            --header "$auth" "$base_url/api/orders" | jq --exit-status --raw-output '.[0].id')
          curl --fail --silent --show-error --max-time 10 \
            --header "$auth" "$base_url/api/orders/$own_id" >/dev/null

          login='{"username":"boris","password":"boris123"}'
          other_token=$(curl --fail --silent --show-error --max-time 10 \
            --header 'Content-Type: application/json' --data "$login" \
            "$base_url/api/auth/login" | jq --exit-status --raw-output '.token | select(length > 0)')

          unauthorized=$(curl --silent --show-error --max-time 10 --output /dev/null \
            --write-out '%{http_code}' "$base_url/api/orders")
          foreign=$(curl --silent --show-error --max-time 10 --output /dev/null \
            --write-out '%{http_code}' --header "Authorization: Bearer $other_token" \
            "$base_url/api/orders/$own_id")

          echo "Own order: 200; missing token: $unauthorized; foreign order: $foreign"
          test "$unauthorized" = 401
          test "$foreign" = 404
      - name: Build monitoring webhook image
        run: docker build --tag webhook-receiver:ci monitoring/webhook-receiver
      - name: Scan dependencies and generate SBOM
        if: ${{ !cancelled() && steps.maven.outcome == 'success' }}
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.2
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-reports" "$RUNNER_TEMP/trivy-cache"
          scan() {
            docker run --rm \
              -v "$GITHUB_WORKSPACE/pom.xml:/src/pom.xml:ro" \
              -v "$HOME/.m2/repository:/root/.m2/repository:ro" \
              -v "$RUNNER_TEMP/dependency-reports:/reports" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" "$@"
          }
          # Maven verify has already resolved the dependencies. Reuse its POM cache.
          scan fs --no-progress --offline-scan --format cyclonedx --output /reports/sbom.cdx.json /src
          scan sbom --no-progress --format json --output /reports/trivy.json /reports/sbom.cdx.json
          scan convert --scanners vuln --format table /reports/trivy.json
      - name: Upload dependency reports
        if: ${{ !cancelled() && steps.maven.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: dependency-reports
          path: ${{ runner.temp }}/dependency-reports/
          retention-days: 14

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
      SEMGREP_IMAGE: semgrep/semgrep:1.184.0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create report directory
        run: mkdir -p "$RUNNER_TEMP/ci-reports"
      - name: Check Git history and files for secrets
        run: |
          scan() {
            docker run --rm \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
              "$GITLEAKS_IMAGE" "$@"
          }
          status=0
          scan git --log-opts=--all --redact=100 --report-format=json --report-path=/reports/gitleaks-history.json /repo || status=$?
          scan dir --redact=100 --report-format=json --report-path=/reports/gitleaks-files.json /repo || status=$?
          exit "$status"
      - name: Analyze source code
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/ci-reports:/reports" \
            "$SEMGREP_IMAGE" semgrep scan --config p/default --metrics=off --disable-version-check \
            --json-output=/reports/semgrep.json /src
      - name: Upload security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: ${{ runner.temp }}/ci-reports/
          retention-days: 14
